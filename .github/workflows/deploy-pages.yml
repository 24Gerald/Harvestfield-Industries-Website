name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/admiring-dijkstra-fhrolk, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - id: pages
        uses: actions/configure-pages@v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          # e.g. /Harvestfield-Industries-Website; switches next.config.mjs to a static export
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # The static copy has no server, so its Media page reads posts from the live Vercel site
          NEXT_PUBLIC_MEDIA_API: https://harvestfield-industries-website.vercel.app
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
